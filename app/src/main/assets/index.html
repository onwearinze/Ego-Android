function catalogImageFor(symbol,label){
 const byLabel=catalogByName[catalogKey(label)];
 if(byLabel)return byLabel;
 const localArt=objectArt[String(symbol||'')];
 if(localArt)return 'images/objects/'+localArt;
 const mapped=emojiCatalog[String(symbol||'')];
 return mapped?catalogByName[catalogKey(mapped)]:null;
}

let musicTimer=null,musicCtx=null;function speak(t, pace='normal'){
  if(!speech)return;
  const text=String(t||'').trim();
  if(!text)return;
  try{
    if(window.EgoNative){
      if(typeof EgoNative.speechAvailable==='function' && EgoNative.speechAvailable()){
        if(pace==='slow' && typeof EgoNative.speakSlow==='function'){EgoNative.speakSlow(text);return;}
        if(typeof EgoNative.speak==='function'){EgoNative.speak(text);return;}
      }
      // In the Android APK, do not fall back to network-backed browser speech.
      if(typeof EgoNative.speak==='function')EgoNative.speak(text);
      return;
    }
    if('speechSynthesis' in window){
      window.speechSynthesis.cancel();
      const utterance=new SpeechSynthesisUtterance(text);
      utterance.lang='en-GB';
      utterance.rate=pace==='slow'?0.68:0.88;
      utterance.pitch=1.0;
      window.speechSynthesis.speak(utterance);
    }
  }catch(error){console.warn('EGO system speech unavailable:',error);}
}

if(sub==='gameNumber'){let target=round+1;let opts=[target,target+1,Math.max(1,target-1),target+2].sort((a,b)=>((a*11+round*7)%17)-((b*11+round*7)%17));gameState.target=target;html=`<div class="lesson playable"><div class="game-kicker">🌉 NUMBER QUEST · ${round+1}/10</div><div class="big">🌊</div><div class="word">Cross the counting river!</div><p>Choose stepping stone <b>${target}</b> to help Ego cross.</p><div class="river-bank">🏝️ <span>🌊 🌊 🌊 🌊 🌊</span> 🏡</div><div class="game-object-grid">${opts.map(n=>`<button class="game-object stone" onclick="numberStep(${n})">${n}</button>`).join('')}</div><div class="game-hint" id="gameHint">Count aloud, then tap ${target}.</div></div>`;msg=`Can you find number ${target} to cross the river?`}

if(sub==='gameTreasure'){let target=treasureItems[(round*3)%treasureItems.length],opts=[target,...treasureItems.filter((_,i)=>i!==((round*3)%treasureItems.length)).slice((round*2)%6,(round*2)%6+3)].sort((a,b)=>((a[1].length*9+round*5)%17)-((b[1].length*9+round*5)%17));gameState.treasure=target;html=`<div class="lesson playable"><div class="game-kicker">💎 TREASURE HUNT · ${round+1}/10</div><div class="big">🗺️</div><div class="word">Find the hidden treasure!</div><p>Find something <b>${target[2]}</b>${target[3]&&target[3]!=='circle'?' and shaped like a '+target[3]:''}.</p><div class="treasure-chest">🧰 ✨</div><div class="game-object-grid">${opts.map(a=>`<button class="game-object treasure-object" onclick="treasurePick(this,'${a[1]}')">${objectIllustration(a[0],a[1])}<small>${a[1]}</small></button>`).join('')}</div><div class="game-hint" id="gameHint">Look closely at the colours and shapes.</div></div>`;msg=`Find the ${target[2]} treasure.`}

function gameWrong(message){let h=$('gameHint');if(h)h.textContent=message||'Good try! Have another look.';if(effects){try{navigator.vibrate&&navigator.vibrate(35)}catch(e){}}}
function alphabetStep(btn,sequence){let expected=sequence[gameState.next];if(btn.dataset.letter!==expected){gameWrong(`Look for ${expected}. You can do it!`);return}btn.disabled=true;btn.classList.add('game-correct');let dot=$('path'+gameState.next);if(dot)dot.classList.add('path-done');gameState.next++;if(gameState.next===sequence.length){speak('Wonderful! You put the letters in order.');gameRoundDone('Letters connected! ⭐')}else{$('gameHint').textContent=`Great! Now find ${sequence[gameState.next]}.`;speak(sequence[gameState.next])}}

function memoryMatch(btn){if(btn.disabled||gameState.open.length===2)return;btn.textContent=btn.dataset.value;btn.classList.add('open');gameState.open.push(btn);if(gameState.open.length===2){let [a,b]=gameState.open;if(a.dataset.value===b.dataset.value){a.disabled=b.disabled=true;a.classList.add('done');b.classList.add('done');gameState.matched++;gameState.open=[];$('gameHint').textContent=`Lovely match! ${gameState.pairs-gameState.matched} pairs left.`;if(gameState.matched===gameState.pairs){gameRoundDone('All the friends matched! ⭐')}}else{setTimeout(()=>{a.textContent=b.textContent='❔';a.classList.remove('open');b.classList.remove('open');gameState.open=[]},850)}}}

function setupMathDrag(){let token=document.querySelector('.drag-token'),zone=$('mathDrop');if(!token||!zone)return;let dragged=false;token.addEventListener('pointerdown',()=>{dragged=true});document.onpointerup=e=>{if(dragged){let r=zone.getBoundingClientRect();if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)answer(token.dataset.result,token.dataset.result);dragged=false}};token.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',token.dataset.result));}

function setupTrace(){let c=$('trace');if(!c)return;let ctx=c.getContext('2d'),v=sub==='caps'?alphabet[step].toUpperCase():sub==='lower'?alphabet[step].toLowerCase():sub==='digits'?String(step):sentences[step];ctx.fillStyle='#e2d8f0';ctx.font=v.length>5?'bold 60px sans-serif':'bold 190px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(v,350,125);ctx.strokeStyle='#7650c5';ctx.lineWidth=10;ctx.lineCap='round';let down=false;c.onpointerdown=e=>{down=true;let r=c.getBoundingClientRect();ctx.beginPath();ctx.moveTo((e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!down)return;let r=c.getBoundingClientRect();ctx.lineTo((e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height);ctx.stroke()};c.onpointerup=()=>down=false;c.onpointercancel=()=>down=false}
function clearTrace(){let c=$('trace');if(c){c.getContext('2d').clearRect(0,0,c.width,c.height);setupTrace()}}
function setupPaint(){
 const c=$('paint');if(!c)return;
 const ctx=c.getContext('2d',{willReadFrequently:true});
 if(!ctx){const f=$('feedback');if(f)f.textContent='This device could not start the colouring canvas.';return;}
 const slug=pages[step],src='colouring/'+slug+'.svg';
 paintImage=new Image();
 paintImage.onload=()=>{
   ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
   try{ctx.drawImage(paintImage,0,0,c.width,c.height);}
   catch(err){console.error('EGO Little Artist: image draw failed',src,err);const f=$('feedback');if(f)f.textContent='This picture could not be displayed.';}
 };
 paintImage.onerror=()=>{console.error('EGO Little Artist: image failed to load',src);const f=$('feedback');if(f)f.textContent='This picture could not be loaded. Please choose Next or Previous.';};
 paintImage.src=src;
 c.onpointerdown=e=>{
   if(!paintImage||!paintImage.complete||!paintImage.naturalWidth)return;
   e.preventDefault();
   const r=c.getBoundingClientRect();
   const x=Math.max(0,Math.min(c.width-1,Math.floor((e.clientX-r.left)*c.width/r.width)));
   const y=Math.max(0,Math.min(c.height-1,Math.floor((e.clientY-r.top)*c.height/r.height)));
   try{
     const data=ctx.getImageData(0,0,c.width,c.height),d=data.data,w=c.width,h=c.height,start=(y*w+x)*4;
     const isFillable=i=>d[i]>245&&d[i+1]>245&&d[i+2]>245&&d[i+3]>0;
     if(!isFillable(start))return;
     const seen=new Uint8Array(w*h),queue=new Int32Array(w*h);let head=0,tail=0;
     const first=y*w+x;queue[tail++]=first;seen[first]=1;let touchesEdge=false;
     while(head<tail){
       const q=queue[head++],px=q%w,py=(q/w)|0;
       if(px===0||py===0||px===w-1||py===h-1)touchesEdge=true;
       const neighbours=[];
       if(px>0)neighbours.push(q-1);if(px<w-1)neighbours.push(q+1);
       if(py>0)neighbours.push(q-w);if(py<h-1)neighbours.push(q+w);
       for(const n of neighbours){if(seen[n])continue;const ni=n*4;if(isFillable(ni)){seen[n]=1;queue[tail++]=n;}}
     }
     // A region connected to the canvas edge is the unbounded background, not a picture section.
     if(touchesEdge||tail<10)return;
     const match=paintColor.match(/[\da-f]{2}/gi);if(!match||match.length<3)return;
     const col=match.slice(0,3).map(v=>parseInt(v,16));
     for(let i=0;i<tail;i++){const k=queue[i]*4;d[k]=col[0];d[k+1]=col[1];d[k+2]=col[2];d[k+3]=255;}
     ctx.putImageData(data,0,0);
   }catch(err){
     console.error('EGO Little Artist: canvas pixel access/fill failed',err);
     const f=$('feedback');if(f)f.textContent='Colouring could not start. Please close and reopen this activity.';
   }
 };
 c.onpointercancel=()=>{};
}
function setPaint(c){paintColor=c;}
function clearPaint(){const c=$('paint');if(c&&paintImage&&paintImage.complete&&paintImage.naturalWidth){const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(paintImage,0,0,c.width,c.height);}}

function flip(btn){
 if(memoryResolving||btn.dataset.open==='1'||btn.dataset.done==='1')return;
 btn.dataset.open='1';
 btn.innerHTML=`<img class="memory-card-art" src="${btn.dataset.src}" alt="${btn.dataset.value}">`;
 memoryOpen=[...document.querySelectorAll('.mem[data-open="1"]')];
 if(memoryOpen.length!==2)return;
 const opened=[...memoryOpen];
 const [first,second]=opened;
 if(first.dataset.value===second.dataset.value){
   opened.forEach(card=>{card.dataset.done='1';card.disabled=true;card.classList.add('done')});
   memoryOpen=[];
   complete('A matching pair! ⭐');
 }else{
   memoryResolving=true;
   memoryTimeout=setTimeout(()=>{
     opened.forEach(card=>{
       if(card.isConnected&&card.dataset.done!=='1'){
         card.dataset.open='0';
         card.textContent='?';
       }
     });
     memoryOpen=[];
     memoryResolving=false;
     memoryTimeout=null;
   },650);
 }
}
