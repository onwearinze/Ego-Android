function gameRoundDone(message){complete(message||'Fantastic playing! ⭐');gameState.round=(gameState.round||0)+1;if(gameState.round>=10){$('body').innerHTML=`<div class="lesson game-finish"><div class="big">🏆</div><div class="word">You did it, ${child}!</div><p>You completed ${playableGameNames[sub].toLowerCase()}.</p><p>Ten wonderful rounds finished!</p><button class="btn" onclick="startSub('${sub}')">Play again</button><button class="btn light" onclick="openSection('games')">Choose another game</button></div>`;teacher(`Amazing work, ${child}! You finished the game.`);return}step=gameState.round;renderPlayableGame()}
function renderPlayableGame(){answerLocked=false;gameState.round=gameState.round||0;gameState.moves=0;let round=gameState.round,html='';
if(sub==='gameAlphabet'){let start=(round*2)%22,letters=[...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'].slice(start,start+5);gameState.next=0;let shuffled=[...letters].sort((a,b)=>((a.charCodeAt(0)*7+round*13)%19)-((b.charCodeAt(0)*7+round*13)%19));html=`<div class="lesson playable"><div class="game-kicker">🔤 ALPHABET ADVENTURE · ${round+1}/10</div><div class="big">🪁</div><div class="word">Help the letters cross!</div><p>Tap the letters in the right order, starting with <b>${letters[0]}</b>.</p><div class="game-path">${letters.map((v,i)=>`<span id="path${i}" class="path-dot">${i+1}</span>`).join('<span class="path-dash">→</span>')}</div><div class="game-object-grid">${shuffled.map(v=>`<button class="game-object letter-object" data-letter="${v}" onclick="alphabetStep(this,'${letters.join('')}')">${v}</button>`).join('')}</div><div class="game-hint" id="gameHint">Find ${letters[0]}!</div></div>`;msg=`Let's help the letters travel in order. Find ${letters[0]} first.`}
if(sub==='gameNumber'){let target=round+1;let opts=[target,target+1,Math.max(1,target-1),target+2].sort((a,b)=>((a*11+round*7)%17)-((b*11+round*7)%17));gameState.target=target;html=`<div class="lesson playable"><div class="game-kicker">🌉 NUMBER QUEST · ${round+1}/10</div><div class="big">🌊</div><div class="word">Cross the counting river!</div><p>Choose stepping stone <b>${target}</b> to help Ego cross.</p><div class="river-bank">🏝️ <span>🌊 🌊 🌊 🌊 🌊</span> 🏡</div><div class="game-object-grid">${opts.map(n=>`<button class="game-object stone" onclick="numberStep(${n})">${n}</button>`).join('')}</div><div class="game-hint" id="gameHint">Count aloud, then tap ${target}.</div></div>`;msg=`Can you find number ${target} to cross the river?`}
if(sub==='gameSafari'){let animal=safariAnimals[round];gameState.animal=animal;let opts=[animal,...safariAnimals.filter((_,i)=>i!==round).slice((round*2)%6,(round*2)%6+3)].sort((a,b)=>((a[1].length*13+round*7)%17)-((b[1].length*13+round*7)%17));html=`<div class="lesson playable"><div class="game-kicker">🦁 SOUND SAFARI · ${round+1}/10</div><div class="big">🌴</div><div class="word">Who made that sound?</div><p>Listen carefully, then find the animal.</p><button class="btn sound-play" onclick="safariSound()">🔊 Play animal sound</button><div class="game-object-grid">${opts.map(a=>`<button class="game-object animal-object" onclick="safariPick(this,'${a[1]}')">${objectIllustration(a[0],a[1])}<small>${a[1]}</small></button>`).join('')}</div><div class="game-hint" id="gameHint">Tap the speaker to listen again.</div></div>`;msg=`Listen to the animal sound. Which animal do you think it is?`}
if(sub==='gameTreasure'){let target=treasureItems[(round*3)%treasureItems.length],opts=[target,...treasureItems.filter((_,i)=>i!==((round*3)%treasureItems.length)).slice((round*2)%6,(round*2)%6+3)].sort((a,b)=>((a[1].length*9+round*5)%17)-((b[1].length*9+round*5)%17));gameState.treasure=target;html=`<div class="lesson playable"><div class="game-kicker">💎 TREASURE HUNT · ${round+1}/10</div><div class="big">🗺️</div><div class="word">Find the hidden treasure!</div><p>Find something <b>${target[2]}</b>${target[3]&&target[3]!=='circle'?' and shaped like a '+target[3]:''}.</p><div class="treasure-chest">🧰 ✨</div><div class="game-object-grid">${opts.map(a=>`<button class="game-object treasure-object" onclick="treasurePick(this,'${a[1]}')">${objectIllustration(a[0],a[1])}<small>${a[1]}</small></button>`).join('')}</div><div class="game-hint" id="gameHint">Look closely at the colours and shapes.</div></div>`;msg=`Find the ${target[2]} treasure.`}

$('body').innerHTML=html+`<div class="feedback" id="feedback"></div><div class="navrow"><button class="btn light" onclick="openSection('games')">← All games</button><button class="btn" onclick="speak('You can do it, ${child}!')">🔊 Encouragement</button></div>`;teacher(msg);if(sub==='gameSafari')safariSound();}
function gameWrong(message){let h=$('gameHint');if(h)h.textContent=message||'Good try! Have another look.';if(effects){try{navigator.vibrate&&navigator.vibrate(35)}catch(e){}}}
function alphabetStep(btn,sequence){let expected=sequence[gameState.next];if(btn.dataset.letter!==expected){gameWrong(`Look for ${expected}. You can do it!`);return}btn.disabled=true;btn.classList.add('game-correct');let dot=$('path'+gameState.next);if(dot)dot.classList.add('path-done');gameState.next++;if(gameState.next===sequence.length){speak('Wonderful! You put the letters in order.');gameRoundDone('Letters connected! ⭐')}else{$('gameHint').textContent=`Great! Now find ${sequence[gameState.next]}.`;speak(sequence[gameState.next])}}
function numberStep(n){if(n!==gameState.target){gameWrong('That stone is a little slippery. Try another number!');return}speak(`Number ${n}! You crossed the river!`);gameRoundDone('You crossed the river! ⭐')}
function safariSound(){let a=gameState.animal;if(a)speak(a[2])}
function safariPick(btn,name){if(name!==gameState.animal[1]){gameWrong('Listen again. Which animal makes that sound?');return}btn.classList.add('game-correct');speak(`Yes! A ${name}!`);gameRoundDone(`You found the ${name}! ⭐`)}
function treasurePick(btn,name){if(name!==gameState.treasure[1]){gameWrong('Not that treasure. Check the colour clue!');return}btn.classList.add('game-correct');speak(`You found the ${name}!`);gameRoundDone('Treasure found! ⭐')}
function memoryMatch(btn){if(btn.disabled||gameState.open.length===2)return;btn.textContent=btn.dataset.value;btn.classList.add('open');gameState.open.push(btn);if(gameState.open.length===2){let [a,b]=gameState.open;if(a.dataset.value===b.dataset.value){a.disabled=b.disabled=true;a.classList.add('done');b.classList.add('done');gameState.matched++;gameState.open=[];$('gameHint').textContent=`Lovely match! ${gameState.pairs-gameState.matched} pairs left.`;if(gameState.matched===gameState.pairs){gameRoundDone('All the friends matched! ⭐')}}else{setTimeout(()=>{a.textContent=b.textContent='❔';a.classList.remove('open');b.classList.remove('open');gameState.open=[]},850)}}}

function setupMathDrag(){let token=document.querySelector('.drag-token'),zone=$('mathDrop');if(!token||!zone)return;let dragged=false;token.addEventListener('pointerdown',()=>{dragged=true});document.onpointerup=e=>{if(dragged){let r=zone.getBoundingClientRect();if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)answer(token.dataset.result,token.dataset.result);dragged=false}};token.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',token.dataset.result));}
function swipeEnable(){let el=document.querySelector('.lesson'),x=0;if(!el)return;el.ontouchstart=e=>x=e.touches[0].clientX;el.ontouchend=e=>{let d=e.changedTouches[0].clientX-x;if(Math.abs(d)>45)move(d<0?1:-1)}}
function setupTrace(){let c=$('trace');if(!c)return;let ctx=c.getContext('2d'),v=sub==='caps'?alphabet[step]:sub==='lower'?alphabet[step].toLowerCase():sub==='digits'?String(step):sentences[step];ctx.fillStyle='#e2d8f0';ctx.font=v.length>5?'bold 60px sans-serif':'bold 190px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(v,350,125);ctx.strokeStyle='#7650c5';ctx.lineWidth=10;ctx.lineCap='round';let down=false;c.onpointerdown=e=>{down=true;let r=c.getBoundingClientRect();ctx.beginPath();ctx.moveTo((e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!down)return;let r=c.getBoundingClientRect();ctx.lineTo((e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height);ctx.stroke()};c.onpointerup=()=>down=false;c.onpointercancel=()=>down=false}
function clearTrace(){let c=$('trace');if(c){c.getContext('2d').clearRect(0,0,c.width,c.height);setupTrace()}}
function setupPaint(){let c=$('paint');if(!c)return;let ctx=c.getContext('2d',{willReadFrequently:true}),slug=pages[step],src='colouring/'+slug;paintImage=new Image();paintImage.onload=()=>{ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#ffffff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(paintImage,0,0,c.width,c.height)};paintImage.onerror=()=>{$('feedback').textContent='This picture could not be loaded. Please choose Next or Previous.'};paintImage.src=src.endsWith('.svg')?src:src+'.svg';c.onpointerdown=e=>{if(!paintImage||!paintImage.complete)return;let r=c.getBoundingClientRect(),x=Math.max(0,Math.min(c.width-1,Math.floor((e.clientX-r.left)*c.width/r.width))),y=Math.max(0,Math.min(c.height-1,Math.floor((e.clientY-r.top)*c.height/r.height)));let data=ctx.getImageData(0,0,c.width,c.height),d=data.data,w=c.width,h=c.height,start=(y*w+x)*4;let white=i=>d[i]>245&&d[i+1]>245&&d[i+2]>245&&d[i+3]>0;if(!white(start))return;let seen=new Uint8Array(w*h),queue=new Int32Array(w*h),head=0,tail=0,first=y*w+x,touchesEdge=false;queue[tail++]=first;seen[first]=1;while(head<tail){let q=queue[head++],px=q%w,py=(q/w)|0;if(px===0||py===0||px===w-1||py===h-1)touchesEdge=true;for(let n of [q-1,q+1,q-w,q+w]){if(n<0||n>=w*h||seen[n])continue;let nx=n%w,ny=(n/w)|0;if(Math.abs(nx-px)+Math.abs(ny-py)!==1)continue;let ni=n*4;if(white(ni)){seen[n]=1;queue[tail++]=n}}}if(touchesEdge||tail<10)return;let col=paintColor.match(/[\da-f]{2}/gi).map(v=>parseInt(v,16));for(let i=0;i<tail;i++){let k=queue[i]*4;d[k]=col[0];d[k+1]=col[1];d[k+2]=col[2];d[k+3]=255}ctx.putImageData(data,0,0)}}
function setPaint(c){paintColor=c}function clearPaint(){let c=$('paint');if(c&&paintImage&&paintImage.complete){let ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(paintImage,0,0,c.width,c.height)}}
function flip(btn){if(btn.dataset.open==='1'||btn.dataset.done==='1')return;btn.dataset.open='1';btn.textContent=btn.dataset.value;memoryOpen=[...document.querySelectorAll('.mem[data-open="1"]')];let opened=[...document.querySelectorAll('.mem[data-open="1"]')];if(opened.length===2){if(opened[0].dataset.value===opened[1].dataset.value){opened.forEach(x=>{x.dataset.done='1';x.classList.add('done')});complete('A matching pair! ⭐')}else setTimeout(()=>opened.forEach(x=>{x.dataset.open='0';x.textContent='?'}),800)}}
function numberName(n){let u=['zero','one','two','three','four','five','six','seven','eight','nine'],te=['ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'],ty=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];if(n<10)return u[n];if(n<20)return te[n-10];if(n<100)return ty[Math.floor(n/10)]+(n%10?'-'+u[n%10]:'');return 'one hundred'}
function progressScreen(){screen('activity');$('title').textContent='Your Progress';$('desc').textContent='Your little achievements';$('level').textContent='STARS';$('body').innerHTML=`<div class="lesson"><div class="big">⭐ ${stars}</div><div class="word">Stars collected</div><p>${done} activities completed. Keep shining, ${child}!</p><div class="track"><span style="width:${Math.min(100,done*2)}%"></span></div></div>`}

function gate(v,c){if(v===c){$('parentGate').classList.add('hide');$('parentSettings').classList.remove('hide');$('speech').checked=speech;$('music').checked=music;$('effects').checked=effects;$('childName').value=child;$('report').textContent=`${child} has collected ${stars} stars and completed ${done} activities.`;$('speech').onchange=e=>{speech=e.target.checked;localStorage.setItem('ego_speech',speech)};$('music').onchange=e=>{music=e.target.checked;localStorage.setItem('ego_music',music);music?startMusic():stopMusic()};$('effects').onchange=e=>{effects=e.target.checked;localStorage.setItem('ego_effects',effects)}}else speak('Try again, grown-up.')}
